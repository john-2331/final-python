services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: final-python:local
    container_name: final-python
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
      DATABASE_URI: "${DATABASE_URI:-sqlite:///data.db}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
